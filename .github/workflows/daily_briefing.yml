# Briefing de mañana: lunes-viernes a las 09:41 UTC (≈05:41 Chile invierno UTC-4).
# Objetivo: que el correo LLEGUE antes de las 8:00 Chile con holgura, absorbiendo la demora de GitHub.
# OJO 1: el minuto NO es redondo a propósito. GitHub concentra la carga de los cron en el minuto :00
#        de cada hora y ahí los retrasos son peores. El 27 y 28 de agosto de 2026, con cron a las
#        10:00 UTC, GitHub disparó el run +3h30 y +4h00 tarde (correo llegó 09:39 y 10:08 Chile).
#        Si algún día cambias la hora, mantén un minuto "raro": ni :00, ni :15, :30 o :45.
# OJO 2: con 09:41 UTC ya no hay que tocar nada cuando Chile pase a UTC-3 (verano austral, ~sept):
#        la llegada se corre sola a ≈06:50 Chile, igual muy antes de las 8:00.
# OJO 3: GitHub no garantiza los cron; puede retrasarlos horas o saltarse una corrida entera. Si
#        vuelve a pasar seguido, la salida es gatillar el workflow desde un reloj externo.
# Los lunes el script usa 72 h de noticias para cubrir el fin de semana.

name: Daily briefing

on:
  schedule:
    - cron: "41 9 * * 1-5"
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily_briefing.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          EMAIL_DESTINO_BRIEFING: ${{ secrets.EMAIL_DESTINO_BRIEFING }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          BRIEFING_MODE: diario
        run: python daily_briefing.py

      - name: Persistir memoria y estado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add briefings_memoria.json jpm_am_watch_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios de estado que commitear."
          else
            git commit -m "chore: memoria de briefings y estado JPM [skip ci]"
            git push
          fi
